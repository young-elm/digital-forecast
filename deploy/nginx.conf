# 数字预测 H5 —— 放到 /etc/nginx/conf.d/digital-forecast.conf
# 有域名后把 server_name 换成域名；没备案前用公网 IP 访问，保持 "_" 即可。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /var/www/digital-forecast;
    index index.html;

    # 纯静态、没有上传接口，请求体限到最小
    client_max_body_size 1k;
    server_tokens off;

    # 场景图是 jpg 压不动，压缩收益全在 js/css/svg 上
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 只用 expires，不在 location 里写 add_header：
    # nginx 的 add_header 一旦在子级出现，就会把 server 级的全部丢掉。
    location ~* \.(jpg|jpeg|png|svg|css|js)$ {
        expires 7d;
        access_log off;
    }

    # 入口不缓存，改完题库文案刷新就能看到
    location / {
        expires epoch;
        try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; }
}

